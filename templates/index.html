<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Customer Churn Prediction</title>
  </head>
  <body>
    <div class="container bg-pink">
        <h1 class="text-center mt-5">
            Customer Churn Prediction
        </h1>
        <div class="card show p-4 mt-4">
            <h1 class="text-center mb-4">
                Enter Customer Details
            </h1>

            <form action="/predict" method="POST">
                <div class="row">
                    {% for field, options in dropdowns.items() %}
                        <div class="col-md-4 mb-3">

                            <label class="form-label">{{ labels[field] }}</label>
                            <select class="form-select" name="{{ field }}">

                                {% for option in options %}
                                    <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}

                            </select>

                        </div>
                    {% endfor %}

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Monthly Charges</label>
                        <input class="form-control" name="MonthlyCharges" placeholder="Enter monthly charges" required
                               step="0.01" type="number">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Total Charges</label>
                        <input class="form-control" name="TotalCharges" placeholder="Enter total charges" required
                               step="0.01" type="number">
                    </div>

                </div>

                <div class="d-grid mt-4">
                    <button type="submit", class="btn btn-primary btn-lg">
                        Predict Churn
                    </button>
                </div>

            </form>

            {% if prediction %}
            <div class="alert {{ result_class }} mt-4 text-center">
                <h4>Prediction Result</h4>
                <p class="mb-2">{{ prediction }}</p>
                <strong>Churn Probability: {{ probability }}%</strong>
            </div>
            {% endif %}

        </div>

    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
</html>
